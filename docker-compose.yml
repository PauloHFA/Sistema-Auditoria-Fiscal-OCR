services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - document_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn doc_audit.main:app --host 0.0.0.0 --port 8000",
      ]
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    volumes:
      - document_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "doc_audit.worker.celery_app", "worker", "--loglevel=INFO"]
    restart: unless-stopped

  beat:
    build: .
    env_file: .env
    volumes:
      - document_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    command: ["celery", "-A", "doc_audit.worker.celery_app", "beat", "--loglevel=INFO"]
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: doc_audit
      POSTGRES_USER: docaudit
      POSTGRES_PASSWORD: docaudit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docaudit -d doc_audit"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  document_data:
  postgres_data:
  redis_data:
