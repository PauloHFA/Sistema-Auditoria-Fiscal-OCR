name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.8"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run mypy src scripts
      - run: uv run pytest --cov=doc_audit --cov-report=term-missing

  compose-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.8"
      - run: uv sync --locked --all-extras
      - run: cp .env.example .env && sed -i 's/^API_KEY=.*/API_KEY=ci-test-key/' .env
      - run: docker compose up -d --build --wait --wait-timeout 240
      - run: uv run python scripts/smoke_test.py --api-url http://localhost:8000 --api-key ci-test-key
      - run: mkdir -p "$RUNNER_TEMP/reports" && chmod 777 "$RUNNER_TEMP/reports"
      - run: >-
          docker compose run --rm --no-deps
          -v "$GITHUB_WORKSPACE/samples/synthetic:/dataset:ro"
          -v "$RUNNER_TEMP/reports:/reports"
          api python scripts/evaluate_accuracy.py
          --dataset /dataset --threshold adaptive --output /reports/accuracy-adaptive.json
      - run: >-
          docker compose run --rm --no-deps
          -v "$GITHUB_WORKSPACE/samples/synthetic:/dataset:ro"
          -v "$RUNNER_TEMP/reports:/reports"
          api python scripts/evaluate_accuracy.py
          --dataset /dataset --threshold otsu --output /reports/accuracy-otsu.json
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-ocr-accuracy
          path: ${{ runner.temp }}/reports/accuracy-*.json
          if-no-files-found: ignore
      - if: always()
        run: docker compose down -v
