[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "docaudit-ocr"
version = "0.1.0"
description = "Local-first OCR and auditing pipeline for Brazilian fiscal documents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "celery[redis]>=5.4,<6",
    "fastapi>=0.115,<1",
    "numpy>=2,<3",
    "opencv-python-headless==4.14.0.94",
    "pillow>=11,<14",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "pymupdf>=1.24,<2",
    "pytesseract>=0.3.13,<1",
    "python-multipart>=0.0.18,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
per-file-ignores = { "src/doc_audit/api.py" = ["B008"], "src/doc_audit/main.py" = ["B008"] }

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
check_untyped_defs = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
